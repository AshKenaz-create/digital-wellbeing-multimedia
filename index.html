<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Recurso multimedia educativo sobre bienestar digital para estudiantes universitarios.">
  <title>Bienestar Digital</title>
  <link rel="icon" type="image/svg+xml" href="assets/icons/favicon.svg">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <a class="skip-link" href="#main" data-i18n="a11y.skip">Saltar al contenido</a>

  <header class="site-header">
    <div class="header-inner">
      <a class="brand" href="#/">
        <span class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="20" height="20">
            <path d="M12 3c3.6 2.6 5.6 5.4 5.6 8.8A5.6 5.6 0 0 1 6.4 11.8C6.4 8.4 8.4 5.6 12 3z" fill="currentColor"/>
          </svg>
        </span>
        <span class="brand-text">
          <span class="brand-name" data-i18n="brand.name">Bienestar Digital</span>
          <span class="brand-tag" data-i18n="brand.tag">Recurso educativo</span>
        </span>
      </a>

      <button class="nav-toggle" type="button" aria-expanded="false" aria-controls="site-nav"
              data-i18n-aria-label="nav.menu">
        <span class="nav-toggle-box" aria-hidden="true">
          <span class="nav-toggle-bar"></span>
          <span class="nav-toggle-bar"></span>
          <span class="nav-toggle-bar"></span>
        </span>
      </button>

      <nav class="site-nav" id="site-nav" data-i18n-aria-label="nav.primary">
        <ul class="nav-list">
          <li><a class="nav-link" href="#/" data-nav="home" data-i18n="nav.home">Inicio</a></li>
          <li class="nav-item-modules">
            <details class="nav-modules">
              <summary class="nav-link nav-modules-summary" data-i18n="nav.modules">Módulos</summary>
              <ul class="nav-modules-list" id="nav-modules-list"></ul>
            </details>
          </li>
          <li><a class="nav-link" href="#/credits" data-nav="credits" data-i18n="nav.credits">Créditos y referencias</a></li>
        </ul>

        <div class="lang-switch" role="group" data-i18n-aria-label="nav.language">
          <button class="lang-btn" type="button" data-lang="es">ES</button>
          <button class="lang-btn" type="button" data-lang="en">EN</button>
        </div>
      </nav>
    </div>
  </header>

  <main id="main" class="site-main" tabindex="-1">
    <div id="app"></div>
  </main>

  <footer class="site-footer">
    <div class="footer-inner">
      <p class="footer-support" data-i18n="footer.support"></p>
      <p class="footer-meta">
        <a href="#/credits" data-i18n="footer.creditsLink"></a>
        <span data-i18n="footer.course"></span>
      </p>
    </div>
  </footer>

  <script type="module" src="js/app.js"></script>
</body>
</html>
